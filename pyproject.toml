[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aureon-mcx"
version = "0.2.0"
description = "Aureon MCX: research-first DhanHQ market-structure observer for MCX GOLD / SILVER futures"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "matplotlib>=3.8",
  "mplfinance>=0.12.10b0",
  "httpx>=0.27",
  "websockets>=12",
  "discord.py>=2.3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["aureon_mcx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
