# Aureon MCX - exchange calendar overrides (optional file).
# Date-specific rules consulted by the ExchangeCalendar:
#   holidays  : full-day closures (no candles are expected, nothing is analysed)
#   overrides : special / partial sessions with their own start and/or end (IST)
# Weekend closure is on by default. Keep this file maintained for MCX holidays.
weekend_closed: true
holidays: []
overrides: []
