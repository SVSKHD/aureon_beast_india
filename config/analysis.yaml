# Aureon MCX - analysis parameters (wick rules, de-clutter, horizons, etc.)

ema_detection:
  # |gap| must be within this fraction of ATR to count as "approaching".
  approach_atr_fraction: 0.5
  # Consecutive closed bars with a shrinking gap before an EARLY event fires.
  min_shrinking_bars: 2

structure:
  # "Equal" high/low tolerance: mode is `atr_fraction` or `ticks`.
  equal_tolerance_mode: atr_fraction
  equal_tolerance_value: 0.1
  # Number of most recent labelled swings used for structure dominance.
  dominance_lookback: 4

wick:
  min_wick_range_fraction: 0.6   # wick >= 60% of candle range
  max_body_range_fraction: 0.3   # body <= 30% of candle range
  min_range_atr: 0.8             # range >= 0.8 * ATR

liquidity:
  proximity_atr_fraction: 0.25
  equal_level_tolerance_atr: 0.1

breakout:
  acceptance_closes: 2
  retest_tolerance_atr: 0.25
  completion_bars: 12
  max_age_bars: 48

rsi_events:
  flat_tolerance: 0.5
  levels: [30.0, 50.0, 70.0]

mtf:
  # Direction classification requires structure not to oppose EMA/RSI read.
  require_structure: true

declutter:
  max_labeled_detections: 4
  max_labeled_setup_events: 3
  context_panel_lines: 10
  chart_bars: 120

horizons:
  bars: [1, 3, 6, 12]
  include_session: true

outcomes:
  min_cohort_sample: 30
  follow_through_atr: 1.0
  invalidation_atr: 1.0
  # Money conversion is disabled unless contract specs are explicitly supplied.
  contract_specs: {}

historical:
  warmup_bars:
    M5: 600
    M15: 300
    H1: 200
  max_days_per_request: 5
  # Missing broker M1 inside a fetched open-market range is NOT assumed to be a zero-trade
  # minute unless this is true (Dhan gives no such guarantee). Default false: fail closed.
  allow_verified_zero_trade_fill: false
  verification_retries: 3
  # Persistent retry schedule for unresolved minutes / gaps (seconds; last value repeats).
  verification_backoff_seconds: [2, 5, 10, 20, 30, 60]
  degraded_after_seconds: 120
  error_after_seconds: 900
  # No packet on a connected socket for this long -> feed STALLED: open minute is SUSPECT.
  feed_stall_seconds: 15
  # Research validation: compare every trusted live M1 with the broker's M1 after a delay.
  reconcile_every_live_m1: false
  reconcile_delay_seconds: 20
  reconcile_volume_tolerance: 0.2

discord:
  debounce_seconds: 5.0

execution:
  # Auto-trade is NOT implemented. This flag exists only so a future Execute
  # workflow is refused unless explicitly enabled.
  enabled: false
